[project]
name = "copilot-approval"
version = "0.1.0"
description = "Approval service (PL3): the human decision on drafts, with maker-checker and step-up."
requires-python = ">=3.12"
dependencies = [
  "copilot-auth",
  "copilot-drafts",
  "copilot-policy-gateway",
  "copilot-tracing",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval"]

[tool.uv.sources]
copilot-auth = { workspace = true }
copilot-drafts = { workspace = true }
copilot-policy-gateway = { workspace = true }
copilot-tracing = { workspace = true }
