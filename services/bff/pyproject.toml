[project]
name = "copilot-bff"
version = "0.1.0"
description = "Backend for the web app: OIDC login, server-side sessions, CSRF, SSE and token exchange."
requires-python = ">=3.12"
dependencies = [
  "copilot-auth",
  "copilot-memory",
  "copilot-orchestrator",
  "copilot-policy-gateway",
  "copilot-tracing",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bff"]

[tool.uv.sources]
copilot-memory = { workspace = true }
copilot-auth = { workspace = true }
copilot-orchestrator = { workspace = true }
copilot-policy-gateway = { workspace = true }
copilot-tracing = { workspace = true }
