[project]
name = "copilot-orchestrator"
version = "0.1.0"
description = "Insights orchestrator: route, plan, render, verify, execute, analyse, narrate, under hard caps."
requires-python = ">=3.12"
dependencies = [
  "copilot-auth",
  "copilot-schemas",
  "copilot-models",
  "copilot-catalogue",
  "copilot-sql-verifier",
  "copilot-policy-gateway",
  "copilot-tracing",
  "copilot-drafts",
  "copilot-memory",
  "copilot-query-api",
  "copilot-mcp-analytics",
  "copilot-mcp-drafts",
  "httpx>=0.27",
  "httpx2",
  "langgraph>=0.2",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
copilot-memory = { workspace = true }
copilot-auth = { workspace = true }
copilot-schemas = { workspace = true }
copilot-models = { workspace = true }
copilot-catalogue = { workspace = true }
copilot-sql-verifier = { workspace = true }
copilot-policy-gateway = { workspace = true }
copilot-tracing = { workspace = true }
copilot-drafts = { workspace = true }
copilot-mcp-drafts = { workspace = true }
copilot-query-api = { workspace = true }
copilot-mcp-analytics = { workspace = true }
