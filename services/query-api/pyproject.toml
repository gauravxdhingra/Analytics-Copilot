[project]
name = "copilot-query-api"
version = "0.1.0"
description = "Reference Query API: runs verified read-only SQL as the requesting user (D4, D6)."
requires-python = ">=3.12"
dependencies = [
  "copilot-auth",
  "copilot-tracing",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlglot>=25",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.scripts]
provision-query-api = "query_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_api"]

[tool.uv.sources]
copilot-auth = { workspace = true }
copilot-tracing = { workspace = true }
