store: treasury.counterparties
definition: "One row per business counterparty we pay or receive from."
owner: { business: treasury-ops, steward: data-platform }
grain: [counterparty_id]
columns:
  - { name: counterparty_id, type: text }
  - { name: name, type: text, description: "Name as given by the counterparty", untrusted: true }
  - { name: country, type: character }
relationships:
  - { name: counterparties.ssis, to: treasury.ssis, join_on: [[counterparty_id, counterparty_id]], cardinality: one_to_many }
known_issues: []
example_questions: ["Which counterparty received the most"]
