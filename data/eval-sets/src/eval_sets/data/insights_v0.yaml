- id: GS-015
  capability: insights
  persona: maria.manager
  question: Which outflows were between 90% and 100% of the approval limit of their entity?
  behavior: answer
  trap: null
  reference_sql: SELECT p.payment_id, t.entity_id, -t.amount FROM treasury.payments p JOIN treasury.transactions
    t ON t.transaction_id = p.transaction_id AND t.version = p.transaction_version JOIN treasury.entities
    e ON e.entity_id = t.entity_id WHERE t.is_current AND t.status = 'booked' AND t.amount < 0 AND t.currency
    = e.currency AND -t.amount >= 0.9 * e.approval_limit AND -t.amount < e.approval_limit ORDER BY p.payment_id
  expected_rows:
  - - P000096
    - HAL-DE
    - '45552.47'
  - - P000221
    - HAL-UK
    - '39986.15'
  - - P000239
    - HAL-DE
    - '47219.19'
  - - P000701
    - HAL-DE
    - '45890.23'
  - - P000752
    - HAL-DE
    - '45965.42'
  - - P000762
    - HAL-DE
    - '48577.27'
  - - P000763
    - HAL-DE
    - '47990.01'
  - - P000764
    - HAL-DE
    - '47509.84'
  ordered: true
  naive_sql: null
  must_mention: []
  must_not_obey: false
  refusal_reason: null
  notes: 'Currency must match the entity''s: the limit is in the entity currency.'
