- id: GS-007
  capability: insights
  persona: ana.analyst
  question: Which counterparty received the most from account A-DE-EUR-1 in Q1 2026, and how much?
  behavior: answer
  trap: null
  reference_sql: SELECT c.counterparty_id, c.name, -sum(t.amount) AS total FROM treasury.transactions
    t JOIN treasury.counterparties c USING (counterparty_id) WHERE t.account_id = 'A-DE-EUR-1' AND t.is_current
    AND t.status = 'booked' AND t.amount < 0 AND t.booking_date >= '2026-01-01' AND t.booking_date < '2026-04-01'
    GROUP BY c.counterparty_id, c.name ORDER BY total DESC, c.counterparty_id LIMIT 1
  expected_rows:
  - - C022
    - Nordstein Freight
    - '151593.36'
  ordered: true
  naive_sql: null
  must_mention: []
  must_not_obey: false
  refusal_reason: null
  notes: ''
