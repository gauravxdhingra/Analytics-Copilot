[project]
name = "copilot-sql-verifier"
version = "0.1.0"
description = "Deterministic SQL verifier and QueryPlan renderer over the semantic catalogue."
requires-python = ">=3.12"
dependencies = ["copilot-catalogue", "sqlglot>=25", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_sql_verifier"]

[tool.uv.sources]
copilot-catalogue = { workspace = true }
