[project]
name = "copilot-mcp-common"
version = "0.1.0"
description = "Shared MCP server plumbing: bearer-token verification and trace-context continuation."
requires-python = ">=3.12"
dependencies = ["copilot-auth", "copilot-tracing", "mcp>=2.3", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_mcp"]

[tool.uv.sources]
copilot-auth = { workspace = true }
copilot-tracing = { workspace = true }
