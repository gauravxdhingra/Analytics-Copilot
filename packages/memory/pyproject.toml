[project]
name = "copilot-memory"
version = "0.1.0"
description = "Per-user conversation memory, preferences and a result cache. User-written, never trusted."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_memory"]
