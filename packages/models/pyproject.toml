[project]
name = "copilot-models"
version = "0.1.0"
description = "Provider-neutral model port with Fake, Replay and Gemini adapters (ADR 0002)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "google-genai>=1.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_models"]
