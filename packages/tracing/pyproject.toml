[project]
name = "copilot-tracing"
version = "0.1.0"
description = "OpenTelemetry tracing with the decision-trace span model; no raw prompts in spans."
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_tracing"]
