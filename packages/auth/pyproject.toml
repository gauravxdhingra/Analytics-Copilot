[project]
name = "copilot-auth"
version = "0.1.0"
description = "Token validation and RFC 8693 token exchange shared by every service."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyjwt[crypto]>=2.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_auth"]
