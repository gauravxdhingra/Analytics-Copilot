[project]
name = "copilot-drafts"
version = "0.1.0"
description = "Drafts for humans to approve: schema with database-enforced separation of duties."
requires-python = ">=3.12"
dependencies = ["copilot-query-api", "psycopg[binary]>=3.2", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_drafts"]

[tool.uv.sources]
copilot-query-api = { workspace = true }
