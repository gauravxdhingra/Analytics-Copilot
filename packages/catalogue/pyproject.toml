[project]
name = "copilot-catalogue"
version = "0.1.0"
description = "Semantic catalogue: what each store means, its grain, filters, money and relationships."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_catalogue"]
