[project]
name = "copilot-evals"
version = "0.1.0"
description = "Gold-set models, result comparison, metrics with confidence intervals, release gates."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_evals"]
