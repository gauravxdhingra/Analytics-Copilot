[project]
name = "copilot-schemas"
version = "0.1.0"
description = "Shared typed data objects: Money, Evidence, Claim, AgentResult."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_schemas"]
