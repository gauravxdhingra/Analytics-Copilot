server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' http://localhost:8081" always;

  location /auth/ {
    proxy_pass http://bff:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://bff:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Answers stream as server-sent events: never buffer them.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
