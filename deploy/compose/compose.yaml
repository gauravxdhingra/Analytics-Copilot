name: analytics-copilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: copilot_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in deploy/compose/.env}
      POSTGRES_DB: analytics
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_owner -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in deploy/compose/.env}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: "8080"
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?}
      ORCHESTRATOR_CLIENT_SECRET: ${ORCHESTRATOR_CLIENT_SECRET:?}
      MCP_ANALYTICS_CLIENT_SECRET: ${MCP_ANALYTICS_CLIENT_SECRET:?}
      MCP_DRAFTS_CLIENT_SECRET: ${MCP_DRAFTS_CLIENT_SECRET:?}
      QUERY_API_CLIENT_SECRET: ${QUERY_API_CLIENT_SECRET:?}
      APPROVAL_CLIENT_SECRET: ${APPROVAL_CLIENT_SECRET:?}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"

  jaeger:
    # Trace UI and OTLP collector for the laptop profile. In-memory: traces are not persisted.
    image: jaegertracing/jaeger:2.23.0 # [VERIFY] pin at each release
    ports:
      - "127.0.0.1:16686:16686" # UI and query API
      - "127.0.0.1:4318:4318" # OTLP over HTTP

volumes:
  pgdata:
