name: analytics-copilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: copilot_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in deploy/compose/.env}
      POSTGRES_DB: analytics
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_owner -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in deploy/compose/.env}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: "8080"
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?}
      ORCHESTRATOR_CLIENT_SECRET: ${ORCHESTRATOR_CLIENT_SECRET:?}
      MCP_ANALYTICS_CLIENT_SECRET: ${MCP_ANALYTICS_CLIENT_SECRET:?}
      MCP_DRAFTS_CLIENT_SECRET: ${MCP_DRAFTS_CLIENT_SECRET:?}
      QUERY_API_CLIENT_SECRET: ${QUERY_API_CLIENT_SECRET:?}
      APPROVAL_CLIENT_SECRET: ${APPROVAL_CLIENT_SECRET:?}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The image has no curl: speak HTTP over a bash socket.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/halcyon HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 40

  bootstrap:
    # One-shot: seed the synthetic warehouse and create every database role. Uses the owner
    # credentials; no long-running service holds them.
    build: &python-build
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
    image: analytics-copilot/python:local
    command: ["python", "deploy/compose/bootstrap.py"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_HOST: postgres:5432
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?}
      DRAFTS_DB_PASSWORD: ${DRAFTS_DB_PASSWORD:?}
      APPROVAL_DB_PASSWORD: ${APPROVAL_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  approval:
    build: *python-build # same image; declared so a cold `compose up` builds it before use
    image: analytics-copilot/python:local
    command: ["uvicorn", "approval.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment: &service-env
      KEYCLOAK_URL: http://localhost:8081 # the issuer: what the browser and tokens say
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080 # where services reach it
      POSTGRES_HOST: postgres:5432
      OTLP_ENDPOINT: http://jaeger:4318
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?} # both write the ledger
      APPROVAL_DB_PASSWORD: ${APPROVAL_DB_PASSWORD:?} # only the approval service reads this
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_started

  bff:
    build: *python-build
    image: analytics-copilot/python:local
    command: ["uvicorn", "bff.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *service-env
      APPROVAL_DB_PASSWORD: "" # the BFF never talks to the approval database role
      PUBLIC_URL: http://localhost:3000
      APPROVAL_URL: http://approval:8002
      JAEGER_URL: http://jaeger:16686
      # Empty by default. `scripted` uses a canned model; with a key, set GEMINI_API_KEY.
      COPILOT_MODEL: ${COPILOT_MODEL:-}
      COPILOT_DEMO: ${COPILOT_DEMO:-}
      # Which model answers: MODEL_PROVIDER=groq|gemini, or the cheaper keyed provider if unset.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?}
      DRAFTS_DB_PASSWORD: ${DRAFTS_DB_PASSWORD:?}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?}
      ORCHESTRATOR_CLIENT_SECRET: ${ORCHESTRATOR_CLIENT_SECRET:?}
      MCP_ANALYTICS_CLIENT_SECRET: ${MCP_ANALYTICS_CLIENT_SECRET:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      approval:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: analytics-copilot/web:local
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      bff:
        condition: service_healthy

  jaeger:
    # Trace UI and OTLP collector for the laptop profile. In-memory: traces are not persisted.
    image: jaegertracing/jaeger:2.23.0 # [VERIFY] pin at each release
    ports:
      - "127.0.0.1:16686:16686" # UI and query API
      - "127.0.0.1:4318:4318" # OTLP over HTTP

volumes:
  pgdata:
